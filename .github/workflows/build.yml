name: Windows-Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PyInstaller installieren
        run: python -m pip install pyinstaller
      - name: Exe bauen
        run: pyinstaller --onefile --windowed --name Satzpuzzle satzpuzzle.py
      - name: Beispieldatei beilegen
        run: Copy-Item saetze.txt dist/
      - name: ZIP erstellen
        run: Compress-Archive -Path dist/Satzpuzzle.exe, dist/saetze.txt -DestinationPath Satzpuzzle-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Satzpuzzle-Windows
          path: |
            dist/Satzpuzzle.exe
            dist/saetze.txt
      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Satzpuzzle-Windows.zip
          generate_release_notes: true
